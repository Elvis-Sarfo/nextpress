<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="benefitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8D4E8;stop-opacity:0.3" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#FF6B35" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#benefitGrad)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="#FF6B35" opacity="0.05"/>
  <circle cx="1100" cy="500" r="120" fill="#B8D4E8" opacity="0.1"/>
  <circle cx="900" cy="150" r="60" fill="#FF6B35" opacity="0.03"/>
</svg>
